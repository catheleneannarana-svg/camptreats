<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="fontawesome/css/all.min.css">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffcf8b, #ff9f6e, #d86f6f);

      background-size: 300% 300%;
      animation: bgMove 10s ease infinite;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .food-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
      opacity: 0.2;
    }

    .food-bg i {
      position: absolute;
      font-size: 40px;
      color: white;
      animation: float 6s infinite ease-in-out alternate;
    }

    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(-20px); }
    }

    .login-card {
      width: 390px;
      padding: 40px 30px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      text-align: center;
      color: #6b6b6b;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      animation: cardPop 1s ease;
    }

    @keyframes cardPop {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .login-card h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 14px;
      opacity: 0.5;
      margin-bottom: 20px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ffdd7a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 35px;
      margin: 0 auto 15px;
      box-shadow: 0 0 15px rgba(255,255,255,0.3);
      animation: floatFood 2.3s ease-in-out infinite;
    }

    @keyframes floatFood {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    input {
      width: 90%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 12px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.25);
      color: #6b6b6b;
      font-size: 18px;
      transition: .3s;
    }

    input::placeholder {
      color: #6b6b6b;
    }

    input:focus {
      transform: scale(1.03);
      background: rgba(255,255,255,0.35);
      box-shadow: 0 0 10px rgba(255,255,255,.4);
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffeb75, #ffa43b);
      color: #6b6b6b;
      font-weight: bold;
      cursor: pointer;
      transition: .3s;
      box-shadow: 0 5px 15px rgba(255,255,255,0.35);
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #fff399, #ffb85a);
    }

    .back {
      position: absolute;
      top: 25px;
      left: 25px;
    }

    .back a {
      color: #fff;
      font-size: 18px;
      text-decoration: none;
      display: flex;
      gap: 5px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="food-bg">
    <i class="fas fa-hamburger" style="top: 15%; left: 10%;"></i>
    <i class="fas fa-pizza-slice" style="top: 40%; left: 80%; animation-delay: .5s;"></i>
    <i class="fas fa-ice-cream" style="top: 70%; left: 20%; animation-delay: 1s;"></i>
    <i class="fas fa-cookie" style="top: 30%; left: 60%; animation-delay: 1.3s;"></i>
    <i class="fas fa-hotdog" style="top: 80%; left: 75%; animation-delay: .2s;"></i>
  </div>

  <div class="back">
    <a href="homepage.html">
      <i class="fa-solid fa-angle-left"></i> Back
    </a>
  </div>

  <div class="login-card">

    <div class="avatar">🍔</div>

    <h2>Welcome Hungry Student!</h2>
    <div class="sub">Login to order your snacks & meals 🍕✨</div>

    <form action="php/login.php" method="POST">
      <input type="text" name="username" placeholder="Student Username" required>
      <input type="email" name="email" placeholder="Student Email" required>
      <input type="password" name="password" placeholder="Password" required>

      <button type="submit">Order Now 🍟</button>
    </form>

  </div>

</body>
</html>
