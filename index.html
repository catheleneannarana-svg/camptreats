<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register - CampTreats</title>
  <link rel="stylesheet" href="fontawesome/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(135deg, #ffcf8b, #ff9f6e, #d86f6f);
      background-size: 300% 300%;
      animation: bgFlow 10s ease infinite;
    }

    @keyframes bgFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .food-icons i {
      position: absolute;
      font-size: 42px;
      color: rgba(255,255,255,0.18);
      animation: float 4s infinite ease-in-out alternate;
    }

    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(-18px); }
    }

    .icon1 { top: 15%; left: 10%; }
    .icon2 { top: 65%; left: 78%; }
    .icon3 { top: 42%; left: 18%; }
    .icon4 { top: 80%; left: 48%; }
    .icon5 { top: 22%; left: 70%; }

    .back {
      position: absolute;
      top: 22px;
      left: 30px;
    }

    .back a {
      color: #fff;
      font-weight: 600;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: .3s;
    }

    .back a:hover {
      transform: translateX(-6px);
      color: #fff3c4;
    }

    .register-card {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(16px);
      padding: 30px 35px;
      width: 360px;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
      text-align: center;
      color: #242323;
      animation: fadeIn .9s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .register-card h2 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #000000;
    }

    .register-card p {
      font-size: 14px;
      margin-bottom: 20px;
      opacity: .9;
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: rgba(5, 5, 5, 0.8);
      font-size: 15px;
    }

    .register-card input {
      width: 87%;
      padding: 14px 14px 14px 42px;
      background: rgba(255,255,255,0.28);
      border: none;
      border-radius: 14px;
      outline: none;
      color: rgb(0, 0, 0);
      font-size: 15px;
      transition: .3s;
    }

    .register-card input::placeholder {
      color: rgba(63, 62, 62, 0.9);
    }

    .register-card input:focus {
      background: rgba(255,255,255,0.4);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      color: #3a2a00;

      background: linear-gradient(135deg, #fff6a6, #ffae42);
      box-shadow: 0 10px 20px rgba(255,255,255,.4);
      transition: .3s;
    }

    button:hover {
      transform: translateY(-2px) scale(1.05);
      background: linear-gradient(135deg, #fffbd0, #ffc368);
    }

    .container {
      margin-top: 18px;
      font-size: 14px;
    }

    .container a {
      color: #fffbd5;
      font-weight: 600;
      text-decoration: none;
    }

    .container a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="food-icons">
    <i class="fas fa-hamburger icon1"></i>
    <i class="fas fa-pizza-slice icon2"></i>
    <i class="fas fa-cookie-bite icon3"></i>
    <i class="fas fa-hotdog icon4"></i>
    <i class="fas fa-ice-cream icon5"></i>
  </div>

  <div class="back">
    <a href="homepage.html"><i class="fa-solid fa-chevron-left"></i> Back</a>
  </div>

  <div class="register-card">
    <h2>CampTreats 🍔</h2>
    <p>Create your tasty account</p>

    <form method="POST" action="php/register.php">
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" name="email" placeholder="Email" required>
      </div>

      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" name="username" placeholder="Username" required>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" placeholder="Password" required>
      </div>

      <div class="input-group">
        <i class="fas fa-id-card"></i>
        <input type="text" name="fname" placeholder="Full Name" required>
      </div>

      <div class="input-group">
        <i class="fas fa-phone"></i>
        <input type="text" name="num" placeholder="Phone Number">
      </div>

      <button type="submit">Create Account 🍟</button>
    </form>

    <div class="container">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

</body>
</html>
